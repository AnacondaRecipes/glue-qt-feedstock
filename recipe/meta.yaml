{% set name = "glue-qt" %}
{% set version = "0.4.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: a50a2641c0cfc23081e1e76e0267c73fa6ba2eccc6151c9143bc5e603f4c5423

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  osx_is_app: true  # [osx]
  entry_points:
    - glue = glue_qt.main:main
  # Ipython 9.6.0+ start supporting python 3.14, skip 314.
  skip: true  # [py<38 or py>313]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=61.2
    - setuptools_scm
  run:
    - python
    - glue-core >=1.23.0
    - numpy >=1.17
    - matplotlib-base >=3.2
    - scipy >=1.1
    - echo >=0.6
    - astropy >=4.0
    - setuptools >=30.3.0
    - qtpy >=1.9
    - ipython >=4.0,<9.0
    - ipykernel >=4.0,!=5.0.0,!=5.1.0
    - qtconsole >=4.3,!=5.4.2
    - pvextractor >=0.2
  run_constrained:
    - pyqt >=5.14,<6.0.0a0

{% set tests_to_skip = "_not_a_real_test" %}
# AttributeError: 'Axes' object has no attribute 'coords'
{% set tests_to_skip = tests_to_skip + " or test_load_viewers_04" %}  # [py<311]
{% set tests_to_skip = tests_to_skip + " or test_load_pixel_components_07" %}  # [py<311]

test:
  imports:
    - glue_qt
    - glue_qt.app
  requires:
    - pip
    - pytest
    - pyqt
    - setuptools >=30.3.0
  commands:
    - pip check
    - glue --help
    - glue --version
    - QT_QPA_PLATFORM=offscreen pytest -v --pyargs glue_qt.tests -k "not ({{ tests_to_skip }})" # [unix]
    - pytest -v --pyargs glue_qt.tests -k "not ({{ tests_to_skip }})" # [not unix]

# NOTE: we deliberatey do NOT include an app entry here, because we instead do this
# in the glueviz meta-package (we don't want glue to appear twice in the navigator)

about:
  home: https://github.com/glue-viz/glue-qt/tree/main
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Multidimensional data visualization across files
  description: Glue is a python project to link visualizations of scientific datasets across many files
  doc_url: https://glueviz.org
  dev_url: https://github.com/glue-viz/glue-qt/tree/main

extra:
  recipe-maintainers:
    - astrofrog
  skip-lints:
    - python_build_tool_in_run
